name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScanIP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScanIP-apk
          path: |
            ScanIP.apk
            app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScanIP 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ScanIP.apk
          body: |
            Download **ScanIP.apk** below on your Android phone and open it to install.
            Built from ${{ github.sha }} on branch ${{ github.ref_name }}.
